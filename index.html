<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>마우스야 놀자 - 청춘 컴퓨터 교실</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js for pleasant audio feedback & BGM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        body {
            font-family: 'Jua', sans-serif;
            background: linear-gradient(to bottom, #e0f2fe 0%, #bae6fd 60%, #bbf7d0 60%, #86efac 100%);
            user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }
        
        input {
            user-select: auto;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.3s ease-out forwards;
        }

        @keyframes floatText {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-40px) scale(1.2); opacity: 0; }
        }
        .float-score {
            animation: floatText 0.8s ease-out forwards;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col items-center">

    <header id="header" class="w-full max-w-5xl p-4 flex justify-between items-center gap-2 hidden z-50">
        <div class="flex gap-2">
            <button onclick="goHome()" class="px-5 py-2.5 bg-white text-gray-700 text-xl md:text-2xl rounded-full shadow-md hover:bg-gray-100 transition-colors border-2 border-gray-200 flex items-center gap-2">
                🏠 처음으로
            </button>
        </div>
        <div class="flex gap-2">
            <button id="font-size-btn" onclick="cycleFontSize()" class="px-5 py-2.5 bg-white text-gray-700 text-xl md:text-2xl rounded-full shadow-md hover:bg-gray-100 transition-colors border-2 border-gray-200 flex items-center gap-2">
                🔍 글자 크게
            </button>
            <button id="bgm-toggle-btn" onclick="toggleBgMusic()" class="px-5 py-2.5 bg-white text-gray-700 text-xl md:text-2xl rounded-full shadow-md hover:bg-gray-100 transition-colors border-2 border-gray-200 flex items-center gap-2">
                🔇 음악 끄기
            </button>
        </div>
    </header>

    <main id="app-content" class="w-full max-w-5xl flex-1 flex flex-col justify-center items-center p-4 relative overflow-y-auto no-scrollbar">
        
        <!-- 화면 1: 이름 입력 -->
        <div id="view-name-input" class="flex flex-col items-center justify-center gap-8 w-full max-w-md h-full my-auto">
            <div class="text-8xl mb-2 animate-bounce">🐦</div>
            <h1 class="text-5xl md:text-6xl text-sky-800 text-center drop-shadow-sm">
                마우스야 놀자
            </h1>
            <p class="text-2xl md:text-3xl text-gray-700 text-center">어르신의 성함을 입력해 주세요</p>
            <input type="text" id="user-name-field" class="w-full bg-white px-8 py-5 rounded-3xl shadow-inner border-4 border-sky-300 text-3xl md:text-4xl text-center focus:outline-none focus:border-sky-500 transition-colors" placeholder="이름 입력" autocomplete="off" maxlength="10">
            <button onclick="startApp()" class="w-full py-5 bg-sky-500 hover:bg-sky-600 text-white text-3xl md:text-4xl rounded-full shadow-lg transition-all transform hover:scale-105">
                시작하기 🚀
            </button>
        </div>

        <!-- 화면 2: 난이도 / 모드 선택 -->
        <div id="view-difficulty" class="hidden flex flex-col items-center gap-8 w-full max-w-3xl my-auto">
            <div class="text-center">
                <h1 class="text-4xl md:text-5xl text-sky-800 mb-2">원하시는 난이도를 골라주세요</h1>
                <p class="text-xl md:text-2xl text-gray-600">초보 어르신께는 '느긋하게 (초급)' 모드를 추천합니다!</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full px-4">
                <button onclick="startGameMode('easy')" class="py-8 px-6 bg-white rounded-3xl shadow-xl hover:bg-sky-50 transition-all border-4 border-emerald-400 flex flex-col items-center gap-3 group">
                    <span class="text-6xl group-hover:scale-110 transition-transform">🐢</span>
                    <span class="text-3xl text-emerald-800 font-bold">느긋하게 (초급)</span>
                    <span class="text-lg text-gray-500 text-center">새들이 천천히 나타나고 시간 제한이 없어요</span>
                </button>
                <button onclick="startGameMode('normal')" class="py-8 px-6 bg-white rounded-3xl shadow-xl hover:bg-sky-50 transition-all border-4 border-sky-400 flex flex-col items-center gap-3 group">
                    <span class="text-6xl group-hover:scale-110 transition-transform">🐇</span>
                    <span class="text-3xl text-sky-800 font-bold">재미있게 (일반)</span>
                    <span class="text-lg text-gray-500 text-center">2분 30초 동안 신나게 새를 잡아봐요</span>
                </button>
            </div>
        </div>

        <!-- 게임 플레이 화면 (Canvas) -->
        <div id="view-game" class="hidden absolute inset-0 w-full h-full">
            <div id="hud" class="absolute top-20 left-0 w-full flex justify-between px-6 pointer-events-none z-20">
                <div class="bg-white/90 px-6 py-3 rounded-2xl shadow-md text-2xl md:text-3xl font-bold text-sky-900 border-2 border-white" id="hud-name">어르신</div>
                <div class="bg-white/90 px-6 py-3 rounded-2xl shadow-md text-2xl md:text-3xl font-bold text-emerald-700 border-2 border-white" id="hud-timer">시간: 무제한</div>
                <div class="bg-white/90 px-6 py-3 rounded-2xl shadow-md text-2xl md:text-3xl font-bold text-amber-600 border-2 border-white" id="hud-score">점수: 0</div>
            </div>
            <canvas id="gameCanvas" class="w-full h-full block cursor-crosshair"></canvas>
        </div>

        <!-- 게임 종료 화면 -->
        <div id="view-win" class="hidden flex flex-col items-center justify-center gap-6 text-center absolute inset-0 bg-white/95 z-50 p-6">
            <div class="text-8xl animate-bounce">🎉🐦🎉</div>
            <h1 class="text-5xl md:text-6xl text-sky-800 font-bold">수고하셨습니다!</h1>
            <p id="win-name" class="text-3xl text-gray-700"></p>
            <div id="win-score" class="text-6xl md:text-7xl text-amber-600 font-ext500 my-2">0점</div>
            <p class="text-2xl md:text-3xl text-purple-600">마우스 실력이 쑥쑥 늘어나셨어요!</p>
            <div class="flex gap-4 mt-6">
                <button onclick="goToDifficulty()" class="px-8 py-5 bg-sky-500 hover:bg-sky-600 text-white text-3xl rounded-full shadow-lg transition-all">
                    다시 하기
                </button>
                <button onclick="goHome()" class="px-8 py-5 bg-gray-500 hover:bg-gray-600 text-white text-3xl rounded-full shadow-lg transition-all">
                    처음으로
                </button>
            </div>
        </div>

    </main>

    <script>
        let userName = "어르신";
        let gameMode = 'easy'; // 'easy' or 'normal'
        let score = 0;
        let timeLeft = 150; // 2분 30초
        let gameRunning = false;
        let gameInterval = null;
        let animationFrameId = null;

        let canvas, ctx;
        let cloudOffset = 0;
        const birdEmojis = ['🐦', '🦜', '🦉', '🐤', '🦆', '🐧'];
        let birds = [];
        let floatingTexts = []; // 클릭 시 점수 팝업 효과
        let spawnTimer = 0;

        // Audio setup via Tone.js
        let synth, isAudioInitialized = false, isBgMusicOn = true, bgMusicReady = false;
        let bgMelodySynth, bgBassSynth, bgMelodySeq, bgBassSeq;

        async function initAudio() {
            if (isAudioInitialized) return;
            try {
                await Tone.start();
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.5 }
                }).toDestination();
                isAudioInitialized = true;
            } catch (e) {
                console.warn("오디오 초기화 실패", e);
            }
        }

        function playHitSound() { if (synth) synth.triggerAttackRelease(["C5", "E5", "G5"], "16n", "+0", 0.4); }
        function playClickSound() { if (synth) synth.triggerAttackRelease("C4", "32n", "+0", 0.3); }
        function playWinSound() {
            if (synth) {
                const now = Tone.now();
                synth.triggerAttackRelease("C4", "8n", now);
                synth.triggerAttackRelease("E4", "8n", now + 0.2);
                synth.triggerAttackRelease("G4", "8n", now + 0.4);
                synth.triggerAttackRelease("C5", "2n", now + 0.6);
            }
        }

        function initBgMusic() {
            if (bgMusicReady) return;
            try {
                bgMelodySynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.02, decay: 0.2, sustain: 0.2, release: 0.3 }
                }).toDestination();
                bgMelodySynth.volume.value = -18;

                const melodyPattern = ["E4", "G4", "C5", "G4", "A4", "G4", "E4", null];
                bgMelodySeq = new Tone.Sequence((time, note) => {
                    if (note) bgMelodySynth.triggerAttackRelease(note, "8n", time);
                }, melodyPattern, "4n");

                Tone.Transport.bpm.value = 100;
                bgMusicReady = true;
            } catch(e) {}
        }

        async function startBgMusic() {
            if (!isBgMusicOn) return;
            await initAudio();
            initBgMusic();
            if (Tone.Transport.state !== "started") Tone.Transport.start();
            if (bgMelodySeq && bgMelodySeq.state !== "started") bgMelodySeq.start(0);
        }

        function stopBgMusic() {
            if (bgMelodySeq) bgMelodySeq.stop();
            Tone.Transport.stop();
        }

        async function toggleBgMusic() {
            isBgMusicOn = !isBgMusicOn;
            const btn = document.getElementById('bgm-toggle-btn');
            if (isBgMusicOn) {
                if (btn) btn.innerText = "🔇 음악 끄기";
                await startBgMusic();
            } else {
                if (btn) btn.innerText = "🎵 음악 켜기";
                stopBgMusic();
            }
        }

        // Font size scaling for seniors
        let fontSizeLevel = 0;
        const fontSizeSteps = ['100%', '115%', '130%'];
        const fontSizeLabels = ['🔍 보통 글씨', '🔍 큰 글씨', '🔍 아주 큰 글씨'];
        function cycleFontSize() {
            fontSizeLevel = (fontSizeLevel + 1) % fontSizeSteps.length;
            document.documentElement.style.fontSize = fontSizeSteps[fontSizeLevel];
            const btn = document.getElementById('font-size-btn');
            if (btn) btn.innerText = fontSizeLabels[fontSizeLevel];
        }

        function hideAllViews() {
            ['view-name-input', 'view-difficulty', 'view-game', 'view-win'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
        }

        async function startApp() {
            const input = document.getElementById('user-name-field').value.trim();
            if (input !== "") userName = input;
            
            try { await initAudio(); playClickShopSound = playClickSound(); } catch(e){}

            hideAllViews();
            document.getElementById('view-difficulty').classList.remove('hidden');
            document.getElementById('header').classList.remove('hidden');
        }

        function goToDifficulty() {
            hideAllViews();
            document.getElementById('view-difficulty').classList.remove('hidden');
            document.getElementById('header').classList.remove('hidden');
            cancelAnimationFrame(animationFrameId);
            clearInterval(gameInterval);
            gameRunning = false;
        }

        function goHome() {
            goToDifficulty();
            hideAllViews();
            document.getElementById('view-name-input').classList.remove('hidden');
            document.getElementById('header').classList.add('hidden');
            stopBgMusic();
        }

        async function startGameMode(mode) {
            gameMode = mode;
            score = 0;
            timeLeft = 150;
            birds = [];
            floatingTexts = [];
            gameRunning = true;

            try { await initAudio(); await startBgMusic(); } catch(e){}

            hideAllViews();
            document.getElementById('view-game').classList.remove('hidden');
            document.getElementById('header').classList.remove('hidden');

            document.getElementById('hud-name').innerText = `👤 ${userName}`;
            document.getElementById('hud-score').innerText = `점수: 0`;

            if (gameMode === 'easy') {
                document.getElementById('hud-timer').innerText = `🕊️ 연습 모드`;
            } else {
                document.getElementById('hud-timer').innerText = `⏱️ 02:30`;
                gameInterval = setInterval(() => {
                    timeLeft--;
                    let min = Math.floor(timeLeft / 60);
                    let sec = timeLeft % 60;
                    document.getElementById('hud-timer').innerText = `⏱️ ${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
                    if (timeLeft <= 0) {
                        endGame();
                    }
                }, 1000);
            }

            initCanvas();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function initCanvas() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', () => {
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });

        function spawnBird() {
            const emoji = birdEmojis[Math.floor(Math.random() * birdEmojis.length)];
            const fromLeft = Math.random() < 0.5;
            const yPos = canvas.height * (0.2 + Math.random() * 0.45);
            
            // 초보 시니어를 위해 아주 느리고 편안한 속도 제공 (Easy 모드는 더욱 느림)
            const speedMultiplier = gameMode === 'easy' ? 0.8 : 1.3;
            const speed = (1.2 + Math.random() * 1.0) * speedMultiplier;

            birds.push({
                emoji: emoji,
                x: fromLeft ? -80 : canvas.width + 80,
                y: yPos,
                vx: fromLeft ? speed : -speed,
                size: 75,
                wobbleSpeed: Math.random() * 0.05 + 0.02,
                wobbleDist: Math.random() * 20 + 10,
                initialY: yPos,
                angle: Math.random() * Math.PI * 2
            });
        }

        // Click / Touch event on canvas
        function handleCanvasClick(clientX, clientY) {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = clientX - rect.left;
            const clickY = clientY - rect.top;

            let hit = false;
            for (let i = birds.length - 1; i >= 0; i--) {
                const b = birds[i];
                // 시니어 맞춤 넉넉한 히트박스 (클릭 판정을 후하게 설정)
                const distance = Math.sqrt((clickX - b.x) ** 2 + (clickY - b.y) ** 2);
                if (distance < b.size * 0.85) {
                    hit = true;
                    score += 10;
                    playHitSound();

                    // 점수 팝업 텍스트 추가
                    floatingTexts.push({
                        text: "+10",
                        x: b.x,
                        y: b.y,
                        opacity: 1,
                        life: 40
                    });

                    birds.splice(i, 1);
                    document.getElementById('hud-score').innerText = `점수: ${score}`;
                    break;
                }
            }

            if (!hit) {
                playClickSound();
                // 헛클릭 시 부드러운 안내 텍스트
                floatingTexts.push({
                    text: "다시 도전!",
                    x: clickX,
                    y: clickY,
                    opacity: 0.8,
                    life: 30
                });
            }
        }

        window.addEventListener('pointerdown', (e) => {
            const gameView = document.getElementById('view-game');
            if (gameView && !gameView.classList.contains('hidden')) {
                handleCanvasClick(e.clientX, e.clientY);
            }
        });

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 배경 장식 (구름, 태양, 풀밭)
            drawBackground();

            // 2. 새 생성 관리
            spawnTimer++;
            const spawnRate = gameMode === 'easy' ? 90 : 65;
            if (spawnTimer > spawnRate) {
                spawnBird();
                spawnTimer = 0;
            }

            // 3. 새 업데이트 및 그리기
            for (let i = birds.length - 1; i >= 0; i--) {
                let b = birds[i];
                b.x += b.vx;
                b.angle += b.wobbleSpeed;
                b.y = b.initialY + Math.sin(b.angle) * b.wobbleDist;

                ctx.save();
                ctx.font = `${b.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 10;
                
                // 진행 방향에 따라 이모지 반전 효과
                if (b.vx < 0) {
                    ctx.scale(-1, 1);
                    ctx.fillText(b.emoji, -b.x, b.y);
                } else {
                    ctx.fillText(b.emoji, b.x, b.y);
                }
                ctx.restore();

                // 화면 밖으로 나가면 제거
                if (b.x < -120 || b.x > canvas.width + 120) {
                    birds.splice(i, 1);
                }
            }

            // 4. 플로팅 텍스트(점수/메시지) 업데이트
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 1.5;
                ft.life--;

                ctx.save();
                ctx.font = 'bold 28px "Jua", sans-serif';
                ctx.fillStyle = ft.text === "+10" ? `rgba(234, 179, 8, ${ft.life / 40})` : `rgba(100, 116, 139, ${ft.life / 30})`;
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();

                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function drawBackground() {
            // 태양
            ctx.save();
            ctx.fillStyle = '#fde047';
            ctx.shadowColor = 'rgba(250, 204, 21, 0.5)';
            ctx.shadowBlur = 40;
            ctx.beginPath();
            ctx.arc(canvas.width - 120, 100, 50, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 흐르는 구름
            cloudOffset += 0.2;
            if (cloudOffset > canvas.width + 200) cloudOffset = -200;

            function drawCloud(x, y, scale) {
                ctx.save();
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.beginPath();
                ctx.arc(x, y, 25 * scale, 0, Math.PI * 2);
                ctx.arc(x + 30 * scale, y - 12 * scale, 30 * scale, 0, Math.PI * 2);
                ctx.arc(x + 60 * scale, y, 22 * scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            drawCloud(cloudOffset, 90, 1);
            drawCloud(cloudOffset + 350, 160, 0.7);
            drawCloud(cloudOffset - 400, 110, 0.85);

            // 하단 풀밭
            const grassTop = canvas.height * 0.6;
            ctx.save();
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(0, grassTop, canvas.width, canvas.height - grassTop);
            
            ctx.strokeStyle = '#15803d';
            ctx.lineWidth = 3;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, grassTop);
                ctx.quadraticCurveTo(i + 5, grassTop - 15, i + 10, grassTop);
                ctx.stroke();
            }
            ctx.restore();
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameInterval);
            cancelAnimationFrame(animationFrameId);
            stopBgMusic();
            playWinSound();

            hideAllViews();
            document.getElementById('view-win').classList.remove('hidden');
            document.getElementById('header').classList.remove('hidden');

            document.getElementById('win-name').innerText = `${userName} 어르신, 정말 잘하셨어요!`;
            document.getElementById('win-score').innerText = `${score}점`;
        }
    </script>
</body>
</html>
